#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          sudo apt-get -yqq full-upgrade
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          # 原 kenzok8/openwrt-honk feed 已移除：改用 sqchr888/honk-strong 二开版（在 Custom Packages 阶段注入）
          ./scripts/feeds update -a

          # 引入 sqchr888/luci-app-iperf3（已汉化的 iPerf3 LuCI 界面，fork 自 Gevatter-Tod）
          # 该仓库是标准 luci 应用布局（Makefile 用 `include ../../luci.mk`），必须放进
          # feeds/luci/applications/ 才能被 feeds 正确索引——
          # 若作为独立 src-git feed，../../luci.mk 会解析到不存在的 feeds/luci.mk，
          # 导致 .files-packageinfo.mk 生成失败、整条 feed 被 Ignoring、包被 defconfig 丢弃。
          rm -rf feeds/luci/applications/luci-app-iperf3
          git clone --depth 1 https://github.com/sqchr888/luci-app-iperf3 feeds/luci/applications/luci-app-iperf3
          ./scripts/feeds update luci

          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

          # ===== 引入 Xiaomi NFC 包（VIKINGYFY/immortalwrt PR#225，作者尚未合并）=====
          # PR: https://github.com/VIKINGYFY/immortalwrt/pull/225
          # 板载 NTAG 标签(NFC) 的 LuCI 配置界面，作者实测 BE10000/BE7000 可用。
          # 上游 owrt 分支尚未合并，故从 PR.patch 直接应用 11 个新文件到 package/emortal/。
          # 该包 LUCI_DEFAULT:=y 默认选中；GENERAL.txt 另加了显式 CONFIG_PACKAGE 双保险。
          # 幂等：若上游哪天合并了 PR（源码已含此包），则跳过注入；校验失败显式报错避免编空包。
          NFC_PKG="./package/emortal/luci-app-xiaomi-nfc"
          if [ -f "$NFC_PKG/Makefile" ]; then
            echo "NFC 包已在上游源码中（PR#225 可能已合并），跳过注入"
          else
            echo "从 PR#225 注入 Xiaomi NFC 包 ..."
            curl -fsSL --retry 3 https://github.com/VIKINGYFY/immortalwrt/pull/225.patch -o /tmp/nfc225.patch
            git apply --whitespace=nowarn /tmp/nfc225.patch || \
              git apply --3way --whitespace=nowarn /tmp/nfc225.patch
          fi
          # 校验：Makefile 存在 + 11 个文件齐全
          test -f "$NFC_PKG/Makefile" || { echo "FAIL NFC 包 Makefile 缺失"; exit 1; }
          grep -q 'PKG_NAME:=luci-app-xiaomi-nfc' "$NFC_PKG/Makefile" || { echo "FAIL NFC Makefile 内容不符"; exit 1; }
          NFC_COUNT=$(find "$NFC_PKG" -type f | wc -l)
          echo "NFC 包注入完成: $NFC_COUNT 个文件"
          if [ "$NFC_COUNT" -lt 11 ]; then echo "FAIL NFC 包文件不足 11 个"; exit 1; fi

          # ===== 修复 luci-app-xiaomi-control 的 NFC 状态读取 ACL（真机实测发现的 bug）=====
          # 现象：LuCI「Xiaomi Control → NFC → 运行状态」误报 "NFC 硬件不可用"，
          #       但后台 /var/run/xiaomi-nfc.json 里 available=true、NDEF 也已正确写入。
          # 根因：xiaomi-control.js 用 fs.read('/var/run/xiaomi-nfc.json') 读状态；
          #       上游 ACL 只允许 /tmp/run/*，而 /var 只是软链到 /tmp，
          #       rpcd 按路径字面匹配（不解析软链）→ 读该文件被拒 → 前端 JSON.parse('') 失败
          #       → nfc={} → !nfc.available → 误报"硬件不可用"。
          #       （/tmp/run/xiaomi-nfc.json 实测返回成功，/var/run/... 返回权限拒绝。）
          # 修复：在 ACL 的 read.file 里补上字面路径 /var/run/xiaomi-nfc.json。幂等。
          CTRL_ACL=$(find ./feeds ./package -path '*acl.d/luci-app-xiaomi-control.json' 2>/dev/null | head -1)
          if [ -n "$CTRL_ACL" ] && ! grep -q '/var/run/xiaomi-nfc.json' "$CTRL_ACL"; then
            sed -i 's#"/tmp/run/\*": \[ "read" \]#"/tmp/run/*": [ "read" ], "/var/run/xiaomi-nfc.json": [ "read" ]#' "$CTRL_ACL"
            grep -q '/var/run/xiaomi-nfc.json' "$CTRL_ACL" || { echo "FAIL xiaomi-control ACL 补丁未生效"; exit 1; }
            echo "已修补 xiaomi-control ACL: $CTRL_ACL"
          else
            echo "xiaomi-control ACL 已修补或未找到: ${CTRL_ACL:-<none>}"
          fi

          # ===== NFC 出厂默认：碰一下打开百度地图导航（2026-11-18 真机验证可用）=====
          # 小米原生 luci-app-xiaomi-control 的 /usr/libexec/xiaomi-nfc.uc 原生支持
          # mode=uri（kind='U', payload=chr(0)+text），会在开机/wireless 变化时自动
          # 把 uri 写进 NTAG 标签，比手写标签更可靠（重启不丢、LuCI 可改）。
          # 真机实测：iPhone 碰顶部触点 → 弹提示 → 百度地图导航到指定地址。
          # 用 buildroot 顶层 files/ 目录注入 uci-defaults，首次启动执行一次；
          # sysupgrade 保留配置时不重跑，不会覆盖用户后续在 LuCI 的修改。
          mkdir -p ./files/etc/uci-defaults
          echo '' | base64 -d > ./files/etc/uci-defaults/zz-xiaomi-nfc-nav
          chmod 0755 ./files/etc/uci-defaults/zz-xiaomi-nfc-nav
          echo "NFC uri 导航出厂默认已注入: $(wc -l < ./files/etc/uci-defaults/zz-xiaomi-nfc-nav) 行"

          # ===== 移除 AdZero（已停用，改由 honk-strong 的 honk-ads 承担广告拦截）=====
          # 缓存恢复可能带来旧 package 目录，显式清理，避免残留包被 defconfig 扫到
          rm -rf ./package/AdZero ./package/adzero ./feeds/luci/applications/luci-app-adzero

          # ===== 用 sqchr888/honk-strong 替换原 kenzok8/openwrt-honk =====
          # honk-strong = 增强版 honk（v0.1.0-beta.6）：geosite overlay 广告拦截(honk-ads)
          #   + DNS 分流 + 中文 LuCI，正好接替 AdZero + mosdns 的角色。
          # 该仓库不是 feed 布局：OpenWrt 包在 firmware/honk-strong/（PKG_NAME:=honk-strong，
          #   PROVIDES:=honk / CONFLICTS:=honk），故直接放进 ./package/ 由 defconfig 扫描。
          # Makefile 强制要求预编译 core：$(CURDIR)/target/aarch64-unknown-linux-musl/release/honk-core，
          #   仓库无 release 二进制，故从 sqchr888/honk-strong 的 release tag
          #   fw-aarch64-20261118 下载（本地 aarch64 musl 构建产物，已验 sha256）；
          #   特意用非 v* tag，避免触发该仓库 release.yml 的全套重编。
          rm -rf ./tmp-honk-strong ./package/honk-strong ./package/honk ./package/luci-app-honk ./feeds/honk
          git clone -q --depth 1 --filter=blob:none --sparse -b main https://github.com/sqchr888/honk-strong.git ./tmp-honk-strong
          (cd ./tmp-honk-strong && git sparse-checkout set firmware/honk-strong)
          cp -rf ./tmp-honk-strong/firmware/honk-strong ./package/honk-strong
          rm -rf ./tmp-honk-strong
          mkdir -p ./package/honk-strong/target/aarch64-unknown-linux-musl/release
          curl -fsSL --retry 3 \
            https://github.com/sqchr888/honk-strong/releases/download/fw-aarch64-20261118/honk-core \
            -o ./package/honk-strong/target/aarch64-unknown-linux-musl/release/honk-core
          echo "5f5cd10ed87ffb315b8e432cdd39ef88f2d7f7034e1780ae60e7bb4a197c3f12  ./package/honk-strong/target/aarch64-unknown-linux-musl/release/honk-core" | sha256sum -c -
          grep -q 'PKG_NAME:=honk-strong' ./package/honk-strong/Makefile || { echo "FAIL honk-strong Makefile 内容不符"; exit 1; }
          echo "honk-strong 注入完成: $(find ./package/honk-strong -type f | wc -l) 个文件, core $(stat -c%s ./package/honk-strong/target/aarch64-unknown-linux-musl/release/honk-core) bytes"

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
